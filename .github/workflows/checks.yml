name: Check application and analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test study core
        run: swift test --package-path src/HoverStudyCore --scratch-path .tmp/swift-build
      - name: Build iPad app without personal signing
        run: >-
          xcodebuild -project src/HoverIntentStudy.xcodeproj -scheme HoverIntentStudy
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath .tmp/DeviceBuild CODE_SIGNING_ALLOWED=NO build
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - name: Test filtering, motion, selection, models and home positions
        working-directory: qa
        run: >-
          python -m unittest test_kinematics test_v2_replay test_two_run_analysis
          test_hover_intent test_motion_study test_behavior_overview test_home_position
      - name: Check public snapshot
        run: python qa/verify_publication.py
