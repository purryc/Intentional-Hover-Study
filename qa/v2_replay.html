<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2 · 手机行为回放</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1018;color:#e6edf7;font:15px system-ui}main{max-width:1460px;margin:auto;padding:26px}h1{font-size:27px;margin:0 0 8px}p{color:#97a6bb;line-height:1.6}button,select,input[type=file]{background:#1a2639;color:#e6edf7;border:1px solid #304361;padding:9px;border-radius:7px}button{cursor:pointer}a{color:#78b8ff}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.grid{display:grid;grid-template-columns:minmax(420px,1fr) 320px;gap:20px}.panel{padding:18px;background:#111b29;border:1px solid #223149;border-radius:14px}#viewport{height:570px;background:#101827;border-radius:12px;overflow:hidden}#viewport canvas{width:100%;height:100%;display:block}#seek{width:100%}#events{max-height:500px;overflow:auto}#events button{display:block;text-align:left;width:100%;margin:5px 0;font-size:12px}#motion{width:100%;height:190px}#message{color:#e9ba69}dt{color:#8f9fb7}dd{margin:3px 0 12px;font-weight:600}.note{font-size:12px;color:#91a4ba}@media(max-width:850px){.grid{grid-template-columns:1fr}#viewport{height:520px}}
</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<main><h1>V2 · 手机行为轨迹</h1><p>14 类任务 · 蓝线：Pencil 悬停 · 橙线：接触 · 圈选、阅读与选择事件同步回放</p>
<div class="toolbar"><a href="./replay.html">旧协议回放</a><label>导入 V2 CSV <input id="file" type="file" accept=".csv"></label><button id="jsonExport">导出分析 JSON</button><button id="csvExport">导出运动 CSV</button></div>
<div class="toolbar" id="filters"><select id="group" aria-label="任务组"></select><select id="task" aria-label="任务"></select><select id="sceneFilter" aria-label="场景"></select><select id="posture" aria-label="姿势"></select><select id="condition" aria-label="条件"></select><select id="trial" aria-label="试次"></select></div>
<div id="message"></div><div class="grid"><section class="panel"><div id="viewport"></div><div class="toolbar"><button id="play">播放</button><button id="flat">正视</button><button id="space">3D</button><button id="full">完整轨迹</button><label>Z 显示比例 <input id="zScale" type="range" min="40" max="320" value="160"></label></div><input id="seek" type="range" min="0" max="1" step="0.001" value="0" aria-label="回放时间"><div id="time"></div><div class="toolbar"><label>对齐事件 <select id="anchor"><option value="TOUCH_DOWN">接触</option><option value="HOVER_SELECT">悬停选择</option><option value="MENU_OPEN">菜单出现</option><option value="CANDIDATE">候选达标</option><option value="LASSO_CLOSE">圈选闭合</option></select></label><select id="anchorEvent" aria-label="选择对齐事件"></select><button id="align">跳到事件前 600 ms</button></div><canvas id="motion"></canvas><p class="note">速度（蓝，pt/s）与二维加速度幅值（橙，pt/s²）仅在连续 XY 段内计算。Z 保留 API 原值，显示比例不是毫米。手指、污染时段、手机外点、结束回调和 &gt;100 ms 缺口均断开。橙色虚线是算法闭合边。视频在记录时间附近定位，受编码帧时间限制。</p></section><aside class="panel"><h2 id="title">导入数据后选择任务</h2><p id="instruction"></p><dl id="stats"></dl><h3>事件</h3><div id="events"></div></aside></div><p id="source"></p></main>
<script id="dataset" type="application/json">__DATA__</script><script type="module" src="./v2_replay.js"></script></html>
